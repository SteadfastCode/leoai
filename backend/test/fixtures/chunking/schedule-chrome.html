<!doctype html>
<html>
  <body>
    <!-- Chrome that is NOT inside <nav>/<footer>, so the scraper's element
         removal does not reach it: a <br>-separated utility menu and a row of
         share/scroll affordances, both runs of short lines in one block. None
         carries a time, date, weekday or price, so none may be joined or kept. -->
    <div class="utility-bar">
      <div class="widget-container">
        <p>Home<br />About<br />Contact<br />Shop<br />Cart</p>
      </div>
    </div>

    <h1>Spring Banquet</h1>

    <div class="share-row">
      <span>Share</span><br /><span>Tweet</span><br /><span>Pin</span><br /><span>Top</span>
    </div>

    <p>The spring banquet is our largest gathering of the year and we would love to see you there. Doors open half an hour before the meal is served.</p>

    <div class="widget-container">
      <p>Fri 6:00 Doors Open<br />6:30 Dinner<br />7:15 Program</p>
    </div>
  </body>
</html>
