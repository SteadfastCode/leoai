# Railway build config — repo root.
#
# Effective only once the Railway service's Root Directory is set to "/"
# (until then Railway builds from backend/ and reads backend/nixpacks.toml).
# The root directory must include the whole repo so backend/index.js can serve
# ../widget at /demo — with the root dir scoped to backend/, the widget files
# never entered the container and /demo/chatbot.js 404'd in production.
#
# No package.json exists at repo root, so no Nixpacks provider auto-detects;
# everything is explicit: node + yarn in setup, install and start cd into backend/.
# nodejs_20, NOT nodejs_22: nixpacks' pinned nixpkgs archive (5148520b) does not
# define nodejs_22 — a build with it failed on "undefined variable" 2026-08-08.
# Production ran node 22 under Railpack; backend pins no engines, 20 is fine.

[phases.setup]
nixPkgs = ["nodejs_20", "yarn", "chromium", "nss", "nspr", "atk", "cups", "libdrm", "dbus", "libxkbcommon", "gtk3", "pango", "cairo", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "xorg.libxcb", "mesa", "expat", "at-spi2-atk", "at-spi2-core", "alsa-lib"]

[phases.install]
# --ignore-engines: the nix yarn package runs under its own internal node 18
# (shebang into its dependency closure), so engine checks see 18 and reject
# undici@7 (needs >=20.18.1). The app itself runs under nodejs_20 from PATH;
# the /health healthcheck gates the deploy if that were ever untrue.
cmds = ["cd backend && yarn install --frozen-lockfile --ignore-engines"]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"

[start]
cmd = "cd backend && PUPPETEER_EXECUTABLE_PATH=$(which chromium) node index.js"
